<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Route Maker</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="map"></div>

  <!-- Shared-route view banner -->
  <div id="viewBanner" class="hidden">
    <div class="vb-info">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="3 11 22 2 13 21 11 13 3 11"/>
      </svg>
      <div>
        <strong id="vbName"></strong>
        <span id="vbDist"></span>
      </div>
    </div>
    <span class="view-badge">Shared Route</span>
  </div>

  <!-- ── Toolbar ─────────────────────────────────────────────────── -->
  <div id="toolbar">
    <span id="toolbar-title">Route Maker</span>

    <div id="tb-left">
      <button id="locateBtn" title="Go to my location">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
        </svg>
        <span>Locate</span>
      </button>

      <div class="tb-sep"></div>

      <button id="drawBtn" title="Draw freehand route">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h9"/>
          <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
        </svg>
        <span>Draw</span>
      </button>

      <button id="undoBtn" title="Undo last segment" disabled>
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 14 4 9 9 4"/>
          <path d="M20 20v-7a4 4 0 0 0-4-4H4"/>
        </svg>
        <span>Undo</span>
      </button>

      <button id="clearBtn" title="Clear all routes" disabled>
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"/>
          <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
          <path d="M10 11v6M14 11v6"/>
        </svg>
        <span>Clear</span>
      </button>

      <div class="tb-sep"></div>

      <button id="saveBtn" title="Save current route (account required)" disabled>
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
          <polyline points="17 21 17 13 7 13 7 21"/>
          <polyline points="7 3 7 8 15 8"/>
        </svg>
        <span>Save</span>
      </button>

      <button id="myRoutesBtn" title="My saved routes (account required)">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
        </svg>
        <span>My Routes</span>
      </button>

      <div id="stats" class="hidden">
        <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"/>
          <polyline points="12 5 19 12 12 19"/>
        </svg>
        <span id="stats-distance"></span>
      </div>
    </div>

    <div id="unitToggle" class="unit-toggle" title="Toggle distance units">
      <button class="unit-btn" data-unit="metric">km</button>
      <button class="unit-btn" data-unit="imperial">mi</button>
    </div>

    <button id="accountBtn">
      <svg id="accountIcon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="2.2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
      <span id="accountLabel">Sign In</span>
    </button>
  </div>

  <!-- ── Auth Modal ──────────────────────────────────────────────── -->
  <div id="authModal" class="modal-overlay hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <button class="modal-x" data-close="authModal">&times;</button>

      <div class="modal-hero">
        <svg xmlns="http://www.w3.org/2000/svg" width="34" height="34" viewBox="0 0 24 24"
             fill="none" stroke="#2563eb" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round">
          <polygon points="3 11 22 2 13 21 11 13 3 11"/>
        </svg>
        <h2>Route Maker</h2>
      </div>

      <div class="modal-tabs">
        <button class="m-tab active" data-tab="signin">Sign In</button>
        <button class="m-tab" data-tab="signup">Create Account</button>
      </div>

      <form id="authForm" novalidate autocomplete="on">
        <div class="f-group">
          <label for="authEmail">Email</label>
          <input type="email" id="authEmail" name="email"
                 placeholder="you@example.com" autocomplete="email" required />
        </div>

        <div class="f-group">
          <label for="authPassword">Password</label>
          <div class="pw-wrap">
            <input type="password" id="authPassword" name="password"
                   placeholder="••••••••" autocomplete="current-password" required />
            <button type="button" class="pw-eye" data-for="authPassword" aria-label="Show password">
              <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24"
                   fill="none" stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="f-group hidden" id="confirmGroup">
          <label for="authConfirm">Confirm Password</label>
          <div class="pw-wrap">
            <input type="password" id="authConfirm" name="confirm"
                   placeholder="••••••••" autocomplete="new-password" />
            <button type="button" class="pw-eye" data-for="authConfirm" aria-label="Show password">
              <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24"
                   fill="none" stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <div id="authMsg" class="f-msg hidden" role="alert"></div>
        <button type="submit" id="authSubmit" class="btn-primary full-w">Sign In</button>
      </form>
    </div>
  </div>

  <!-- ── Save Route Modal ───────────────────────────────────────── -->
  <div id="saveModal" class="modal-overlay hidden" role="dialog" aria-modal="true">
    <div class="modal-card modal-sm">
      <button class="modal-x" data-close="saveModal">&times;</button>
      <h2>Save Route</h2>
      <form id="saveForm" novalidate>
        <div class="f-group">
          <label for="routeName">Route Name</label>
          <input type="text" id="routeName" placeholder="My Route"
                 maxlength="80" autocomplete="off" />
        </div>
        <div id="saveMsg" class="f-msg hidden" role="alert"></div>
        <div class="modal-btns">
          <button type="button" class="btn-secondary" data-close="saveModal">Cancel</button>
          <button type="submit" id="saveSubmit" class="btn-primary">
            <span>Save</span>
          </button>
          <button type="button" id="saveShareBtn" class="btn-accent">Save &amp; Share</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ── Share Modal ───────────────────────────────────────────── -->
  <div id="shareModal" class="modal-overlay hidden" role="dialog" aria-modal="true">
    <div class="modal-card modal-sm">
      <button class="modal-x" data-close="shareModal">&times;</button>
      <div class="share-glyph">
        <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24"
             fill="none" stroke="#2563eb" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
          <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
          <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
        </svg>
      </div>
      <h2>Route Shared!</h2>
      <p class="modal-sub">Anyone with this link can view your route:</p>
      <div class="share-row">
        <input type="text" id="shareUrl" readonly aria-label="Shareable link" />
        <button id="copyBtn" class="btn-copy">Copy</button>
      </div>
      <button class="btn-secondary full-w" data-close="shareModal">Done</button>
    </div>
  </div>

  <!-- ── My Routes Panel ───────────────────────────────────────── -->
  <div id="routesPanel" class="side-panel hidden">
    <div class="panel-head">
      <h3>My Routes</h3>
      <button id="closePanelBtn" aria-label="Close">&times;</button>
    </div>
    <div id="routesList" class="routes-list"></div>
  </div>
  <div id="panelOverlay" class="panel-backdrop hidden"></div>

  <!-- Status / hint -->
  <div id="status-bar" class="hidden" role="status">
    <div id="status-icon"></div>
    <span id="status-text"></span>
  </div>
  <div id="draw-hint" class="hidden">
    Click and drag on the map to draw. Release to snap to roads.
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
