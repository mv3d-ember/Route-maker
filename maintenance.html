<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Site Maintenance</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
    }

    /* ── Login screen ─────────────────────────────────────────── */
    #loginScreen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .login-box {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 40px;
      width: 360px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .login-box h2 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 6px;
      color: #f1f5f9;
    }

    .login-box p {
      color: #64748b;
      font-size: 13px;
      margin-bottom: 28px;
    }

    .field { margin-bottom: 16px; }

    .field label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    .field input {
      width: 100%;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px 14px;
      color: #f1f5f9;
      font-size: 14px;
      outline: none;
      transition: border-color .15s;
    }

    .field input:focus { border-color: #6366f1; }

    .btn-primary {
      width: 100%;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 11px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 6px;
      transition: background .15s;
    }

    .btn-primary:hover { background: #4f46e5; }
    .btn-primary:disabled { background: #334155; color: #64748b; cursor: not-allowed; }

    #loginError {
      color: #f87171;
      font-size: 13px;
      margin-top: 12px;
      text-align: center;
      min-height: 18px;
    }

    /* ── Dashboard ────────────────────────────────────────────── */
    #dashboard { display: none; }

    header {
      background: #1e293b;
      border-bottom: 1px solid #334155;
      padding: 0 28px;
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 {
      font-size: 16px;
      font-weight: 700;
      color: #f1f5f9;
      letter-spacing: -.01em;
    }

    header span {
      font-size: 12px;
      color: #64748b;
    }

    .sign-out-btn {
      background: #334155;
      color: #e2e8f0;
      border: none;
      border-radius: 7px;
      padding: 7px 14px;
      font-size: 13px;
      cursor: pointer;
      transition: background .15s;
    }

    .sign-out-btn:hover { background: #475569; }

    main { padding: 28px; max-width: 1400px; margin: 0 auto; }

    /* ── Stat cards ───────────────────────────────────────────── */
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }

    .stat-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 20px;
    }

    .stat-card .label {
      font-size: 11px;
      font-weight: 600;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: .05em;
      margin-bottom: 8px;
    }

    .stat-card .value {
      font-size: 28px;
      font-weight: 700;
      color: #f1f5f9;
    }

    .stat-card .sub {
      font-size: 12px;
      color: #64748b;
      margin-top: 4px;
    }

    /* ── Toolbar ──────────────────────────────────────────────── */
    .tb {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .tb input[type="search"] {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 8px 14px;
      color: #e2e8f0;
      font-size: 13px;
      outline: none;
      width: 240px;
      transition: border-color .15s;
    }

    .tb input[type="search"]:focus { border-color: #6366f1; }

    .tb select {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 8px 12px;
      color: #e2e8f0;
      font-size: 13px;
      outline: none;
      cursor: pointer;
    }

    .tb .count {
      margin-left: auto;
      font-size: 12px;
      color: #64748b;
    }

    /* ── Table ────────────────────────────────────────────────── */
    .table-wrap {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead th {
      background: #0f172a;
      color: #64748b;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
      padding: 12px 16px;
      text-align: left;
      white-space: nowrap;
      user-select: none;
      cursor: pointer;
    }

    thead th:hover { color: #94a3b8; }
    thead th.sort-asc::after  { content: ' ↑'; }
    thead th.sort-desc::after { content: ' ↓'; }

    tbody tr {
      border-top: 1px solid #1e293b;
      transition: background .1s;
    }

    tbody tr:nth-child(odd) { background: #1e293b; }
    tbody tr:nth-child(even) { background: #172033; }
    tbody tr:hover { background: #263352; }

    td {
      padding: 11px 16px;
      font-size: 13px;
      color: #cbd5e1;
      white-space: nowrap;
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    td.ip   { font-family: monospace; color: #a5b4fc; }
    td.time { color: #64748b; font-size: 12px; }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
    }

    .badge-os      { background: #1d3a5f; color: #93c5fd; }
    .badge-browser { background: #1a3a2a; color: #6ee7b7; }
    .badge-account { background: #2d1f4a; color: #c4b5fd; }
    .badge-anon    { background: #1e293b; color: #64748b; border: 1px solid #334155; }

    #emptyMsg {
      text-align: center;
      padding: 60px;
      color: #475569;
      font-size: 15px;
    }

    .refresh-btn {
      background: #334155;
      color: #e2e8f0;
      border: none;
      border-radius: 7px;
      padding: 7px 14px;
      font-size: 13px;
      cursor: pointer;
      transition: background .15s;
    }

    .refresh-btn:hover { background: #475569; }
    .refresh-btn:disabled { opacity: .5; cursor: not-allowed; }

    #loadingMsg {
      text-align: center;
      padding: 60px;
      color: #475569;
    }

    .spinner {
      display: inline-block;
      width: 20px; height: 20px;
      border: 2px solid #334155;
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<!-- ── Login ───────────────────────────────────────────────────────────────── -->
<div id="loginScreen">
  <div class="login-box">
    <h2>Maintenance</h2>
    <p>Sign in with your admin account to continue.</p>
    <form id="loginForm">
      <div class="field">
        <label>Email</label>
        <input id="loginEmail" type="email" autocomplete="email" required />
      </div>
      <div class="field">
        <label>Password</label>
        <input id="loginPassword" type="password" autocomplete="current-password" required />
      </div>
      <button class="btn-primary" id="loginBtn" type="submit">Sign In</button>
      <div id="loginError"></div>
    </form>
  </div>
</div>

<!-- ── Dashboard ───────────────────────────────────────────────────────────── -->
<div id="dashboard">
  <header>
    <h1>Visitor Dashboard</h1>
    <div style="display:flex;align-items:center;gap:16px">
      <span id="adminLabel"></span>
      <button class="sign-out-btn" id="signOutBtn">Sign Out</button>
    </div>
  </header>

  <main>
    <div class="stats">
      <div class="stat-card">
        <div class="label">Total Visits</div>
        <div class="value" id="statTotal">—</div>
        <div class="sub">all time</div>
      </div>
      <div class="stat-card">
        <div class="label">Unique IPs</div>
        <div class="value" id="statIPs">—</div>
        <div class="sub">distinct addresses</div>
      </div>
      <div class="stat-card">
        <div class="label">Countries</div>
        <div class="value" id="statCountries">—</div>
        <div class="sub">unique</div>
      </div>
      <div class="stat-card">
        <div class="label">Accounts</div>
        <div class="value" id="statAccounts">—</div>
        <div class="sub">registered users</div>
      </div>
    </div>

    <div class="tb">
      <input type="search" id="searchBox" placeholder="Search IP, city, country, OS…" />
      <select id="osFilter">
        <option value="">All OS</option>
        <option>Windows 10/11</option>
        <option>Windows</option>
        <option>macOS</option>
        <option>Android</option>
        <option>iOS</option>
        <option>Linux</option>
      </select>
      <select id="browserFilter">
        <option value="">All Browsers</option>
        <option>Chrome</option>
        <option>Firefox</option>
        <option>Safari</option>
        <option>Edge</option>
        <option>Opera</option>
      </select>
      <button class="refresh-btn" id="refreshBtn">↻ Refresh</button>
      <span class="count" id="rowCount"></span>
    </div>

    <div class="table-wrap">
      <div id="loadingMsg"><span class="spinner"></span>Loading…</div>
      <table id="visitorTable" style="display:none">
        <thead>
          <tr>
            <th data-col="visited_at">Time</th>
            <th data-col="ip">IP Address</th>
            <th data-col="country">Country</th>
            <th data-col="city">City</th>
            <th data-col="region">Region</th>
            <th data-col="os">OS</th>
            <th data-col="browser">Browser</th>
            <th data-col="user_agent">User Agent</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
      <div id="emptyMsg" style="display:none">No visitor records found.</div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
  const sb = window.supabase.createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.anonKey);

  // ── DOM refs ─────────────────────────────────────────────────────────────────
  const loginScreen   = document.getElementById('loginScreen');
  const loginForm     = document.getElementById('loginForm');
  const loginEmail    = document.getElementById('loginEmail');
  const loginPassword = document.getElementById('loginPassword');
  const loginBtn      = document.getElementById('loginBtn');
  const loginError    = document.getElementById('loginError');
  const dashboard     = document.getElementById('dashboard');
  const adminLabel    = document.getElementById('adminLabel');
  const signOutBtn    = document.getElementById('signOutBtn');
  const searchBox     = document.getElementById('searchBox');
  const osFilter      = document.getElementById('osFilter');
  const browserFilter = document.getElementById('browserFilter');
  const refreshBtn    = document.getElementById('refreshBtn');
  const rowCount      = document.getElementById('rowCount');
  const loadingMsg    = document.getElementById('loadingMsg');
  const visitorTable  = document.getElementById('visitorTable');
  const tbody         = document.getElementById('tbody');
  const emptyMsg      = document.getElementById('emptyMsg');

  let allRows   = [];
  let sortCol   = 'visited_at';
  let sortDir   = 'desc';

  // ── Auth ──────────────────────────────────────────────────────────────────────
  sb.auth.onAuthStateChange((event, session) => {
    const user = session?.user ?? null;
    if (user && user.email === ADMIN_EMAIL) {
      loginScreen.style.display = 'none';
      dashboard.style.display   = 'block';
      adminLabel.textContent    = user.email;
      loadVisitors();
    } else if (user) {
      // signed in but not admin
      sb.auth.signOut();
      loginError.textContent = 'Access denied.';
    }
  });

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    loginError.textContent = '';
    loginBtn.disabled      = true;
    loginBtn.textContent   = 'Signing in…';
    const { error } = await sb.auth.signInWithPassword({
      email:    loginEmail.value.trim(),
      password: loginPassword.value,
    });
    if (error) {
      loginError.textContent = error.message;
      loginBtn.disabled      = false;
      loginBtn.textContent   = 'Sign In';
    }
  });

  signOutBtn.addEventListener('click', () => {
    sb.auth.signOut();
    dashboard.style.display   = 'none';
    loginScreen.style.display = 'flex';
    loginForm.reset();
  });

  // ── Data ──────────────────────────────────────────────────────────────────────
  async function loadVisitors() {
    loadingMsg.style.display  = 'block';
    visitorTable.style.display = 'none';
    emptyMsg.style.display    = 'none';
    refreshBtn.disabled       = true;

    const { data, error } = await sb
      .from('visitors')
      .select('*')
      .order('visited_at', { ascending: false })
      .limit(2000);

    refreshBtn.disabled = false;
    loadingMsg.style.display = 'none';

    if (error || !data) {
      emptyMsg.textContent   = 'Failed to load: ' + (error?.message ?? 'unknown error');
      emptyMsg.style.display = 'block';
      return;
    }

    allRows = data;
    updateStats(data);
    renderTable();
  }

  function updateStats(data) {
    document.getElementById('statTotal').textContent     = data.length.toLocaleString();
    document.getElementById('statIPs').textContent       = new Set(data.map(r => r.ip)).size.toLocaleString();
    document.getElementById('statCountries').textContent = new Set(data.map(r => r.country).filter(Boolean)).size.toLocaleString();
    document.getElementById('statAccounts').textContent  = '—';
  }

  function filtered() {
    const q   = searchBox.value.toLowerCase();
    const os  = osFilter.value;
    const br  = browserFilter.value;
    return allRows.filter(r => {
      if (os && r.os !== os) return false;
      if (br && r.browser !== br) return false;
      if (q && !JSON.stringify(r).toLowerCase().includes(q)) return false;
      return true;
    });
  }

  function sorted(rows) {
    return [...rows].sort((a, b) => {
      let va = a[sortCol] ?? '';
      let vb = b[sortCol] ?? '';
      if (va < vb) return sortDir === 'asc' ? -1 : 1;
      if (va > vb) return sortDir === 'asc' ? 1 : -1;
      return 0;
    });
  }

  function renderTable() {
    const rows = sorted(filtered());
    rowCount.textContent = `${rows.length} row${rows.length !== 1 ? 's' : ''}`;

    if (rows.length === 0) {
      visitorTable.style.display = 'none';
      emptyMsg.style.display     = 'block';
      emptyMsg.textContent       = 'No records match your filter.';
      return;
    }

    emptyMsg.style.display     = 'none';
    visitorTable.style.display = 'table';

    tbody.innerHTML = rows.map(r => {
      const time = r.visited_at
        ? new Date(r.visited_at).toLocaleString()
        : '—';
      const ua = r.user_agent
        ? `<span title="${esc(r.user_agent)}">${esc(r.user_agent.slice(0, 60))}…</span>`
        : '—';
      return `<tr>
        <td class="time">${esc(time)}</td>
        <td class="ip">${esc(r.ip ?? '—')}</td>
        <td>${esc(r.country ?? '—')}</td>
        <td>${esc(r.city ?? '—')}</td>
        <td>${esc(r.region ?? '—')}</td>
        <td><span class="badge badge-os">${esc(r.os ?? '—')}</span></td>
        <td><span class="badge badge-browser">${esc(r.browser ?? '—')}</span></td>
        <td style="max-width:300px">${ua}</td>
      </tr>`;
    }).join('');
  }

  function esc(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // ── Sorting ───────────────────────────────────────────────────────────────────
  document.querySelectorAll('thead th[data-col]').forEach(th => {
    th.addEventListener('click', () => {
      const col = th.dataset.col;
      if (sortCol === col) {
        sortDir = sortDir === 'asc' ? 'desc' : 'asc';
      } else {
        sortCol = col;
        sortDir = 'desc';
      }
      document.querySelectorAll('thead th').forEach(h => {
        h.classList.remove('sort-asc', 'sort-desc');
      });
      th.classList.add(sortDir === 'asc' ? 'sort-asc' : 'sort-desc');
      renderTable();
    });
  });

  // ── Filters ───────────────────────────────────────────────────────────────────
  searchBox.addEventListener('input', renderTable);
  osFilter.addEventListener('change', renderTable);
  browserFilter.addEventListener('change', renderTable);
  refreshBtn.addEventListener('click', loadVisitors);
</script>
</body>
</html>
